name: "LEVEL 1: INTRODUCTION"
description: >
  GROUND CONTROL TO ${playerName}:

  FAMILIARISE YOURSELF WITH THE CONTROLS AND ACQUIRE ONE FUEL CAPSULE.

  KEYBOARD: HOLD <UP> TO ACCELERATE; HOLD <LEFT> OR <RIGHT> TO TURN.
  <SHIFT> REDUCES THRUST POWER FOR FINER CONTROL (KEYBOARD ONLY).

  TOUCH: HOLD BOTH SIDES TO ACCELERATE; HOLD ONE SIDE TO TURN.

soundtrack: ambient

ship:
  fuelTank:
    currentAmount: 150
  weapons: [laser]

objects:
  - id: fuel
    type: fuel
    position: [20, 45]
    angularVelocity: .21

objectives:
  - id: collect-fuel
    title: COLLECT A FUEL CAPSULE
    successChecks:
      - type: kill
        target: fuel
