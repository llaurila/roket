<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Roket</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html, body {
          width:  100%;
          height: 100%;
          overflow: hidden;
      }

      * { padding: 0; margin: 0; }

      canvas { background: black; display: block; margin: 0 auto; touch-action: none; }

      #orientation-banner {
          display: none;
          position: fixed;
          z-index: 1;
          top: 0;
          left: 0;
          width: 100%;
          box-sizing: border-box;
          padding: 12px 16px;
          background: #ffcc00;
          color: #000000;
          font: bold 16px Arial, sans-serif;
          text-align: center;
          pointer-events: none;
      }

      @media (orientation: portrait) and (any-pointer: coarse) {
          #orientation-banner { display: block; }
      }
  </style>        
</head>
  <body>
    <canvas id="game" width="480" height="320"></canvas>
    <div id="orientation-banner" role="status">HOLD YOUR PHONE HORIZONTALLY</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
